# The website lives on Vercel at get-loft.com. GitHub Pages only keeps the old install.sh URL working,
# and redirects its index to the new site.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir old
          cp site/install.sh old/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://get-loft.com"><link rel="canonical" href="https://get-loft.com"><a href="https://get-loft.com">get-loft.com</a>' > old/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: old
      - id: deployment
        uses: actions/deploy-pages@v4
