# Loft's agents as agents in Herdr UI. Set up from Loft: Settings → Herdr UI.
id = "loft"
name = "Loft"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Every Loft agent as an agent in Herdr UI: its chat, slash commands, approvals and inspector."
platforms = ["linux", "macos"]

# Open a tab for each Loft agent when Herdr starts.
[[startup]]
command = ["sh", "bin/loft-herdr", "sync"]

[[actions]]
id = "sync"
title = "Show Loft agents"
contexts = ["workspace"]
command = ["sh", "bin/loft-herdr", "sync"]

# One Loft agent's chat; `sync` opens it with LOFT_AGENT_ID set.
[[panes]]
id = "agent"
title = "Loft agent"
placement = "tab"
command = ["sh", "bin/loft-herdr", "chat"]
